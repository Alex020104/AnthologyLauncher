name: Launcher Next CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "*.props"
      - "global.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "*.props"
      - "global.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Anthology.Next.slnx
      - run: dotnet build Anthology.Next.slnx --configuration Release --no-restore
      - run: dotnet test Anthology.Next.slnx --configuration Release --no-build
